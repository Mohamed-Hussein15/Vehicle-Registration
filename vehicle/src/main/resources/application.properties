spring.application.name=vehicle

# Oracle — connect as HR (sample schema). VRL_* tables are created/updated here.
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=hr
spring.datasource.password=hr

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# Late renewal fine (currency units as configured for your deployment)
vrl.fine.amount=50
# Days ahead for "upcoming" inspections
vrl.inspection.upcoming-days=30
